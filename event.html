<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Konferans Teknoloji 2026 — Tikè Lakay</title>
<meta name="description" content="Yon gwo konferans sou teknoloji ak inovasyon nan Ayiti. Achte tikè sou Tikè Lakay.">
<meta name="theme-color" content="#00209F">
<meta property="og:title" content="Tike Lakay - Detay Evenman">
<meta property="og:description" content="We detay evenman an, achte tike, pataje ak zanmi ou.">
<meta property="og:image" content="https://tikelakay.com/assets/og-tike-lakay.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://tikelakay.com/event.html">
<meta property="og:type" content="website">
<link rel="canonical" href="https://tikelakay.com/event.html">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#00209F;--blue-deep:#001566;--blue-light:#0A3ACC;
  --red:#D21034;--red-dark:#B00D2C;--red-glow:rgba(210,16,52,.15);
  --gold:#D4A017;--gold-light:#E8B82E;--gold-soft:#FDF3D7;--gold-glow:rgba(212,160,23,.2);
  --green:#1B8C3D;--green-light:#E8F5E9;
  --white:#FFFFFF;--off-white:#F5F7FA;--cream:#FAFBFD;
  --dark:#0A0E1A;--text:#1A2A4A;--text-light:#5A6B8A;--text-muted:#8A95AA;
  --border:#E2E8F0;--border-light:#F0F3F7;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --shadow-sm:0 1px 3px rgba(10,14,26,.06);
  --shadow-md:0 4px 16px rgba(10,14,26,.08);
  --shadow-lg:0 12px 40px rgba(10,14,26,.12);
  --radius:14px;--radius-lg:20px;
}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--off-white);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:56px}
a{text-decoration:none;color:inherit}
button{font-family:var(--body);cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}

/* FLAG */
.flag-stripe{height:4px;background:linear-gradient(90deg,var(--blue) 50%,var(--red) 50%);position:relative;z-index:1002}

/* HEADER */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-left img{height:30px;border-radius:5px}
.header-left span{font-family:var(--display);font-size:1rem;color:var(--dark)}
.header-left span em{color:var(--red);font-style:italic}
.header-back{
  display:flex;align-items:center;gap:6px;
  font-size:.78rem;font-weight:600;color:var(--text-light);
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  transition:all .2s;
}
.header-back:hover{background:var(--off-white);border-color:var(--text-muted);color:var(--blue)}
.header-back svg{width:16px;height:16px}

/* HERO IMAGE */
.hero-invite{
  width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--dark) 0%,#0A1235 30%,var(--blue-deep) 55%,var(--blue) 80%,var(--gold) 100%);
}
/* His own invitation, whole - never cropped, never stretched. The frame takes
   the shape of the picture (set inline once it has loaded). */
.hero-invite-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:#0A0E1A;z-index:1;
}
.hero-invite.has-invite::before,
.hero-invite.has-invite::after,
.hero-invite.has-invite .hero-grid,
.hero-invite.has-invite .hero-content{display:none}
.hero-invite::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 500px 300px at 20% 80%, rgba(212,160,23,.15) 0%, transparent 70%),
    radial-gradient(ellipse 400px 400px at 80% 20%, rgba(0,32,159,.2) 0%, transparent 70%);
  pointer-events:none;
}
.hero-invite::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 30%, rgba(10,14,26,.7) 100%);
  pointer-events:none;
}
.hero-grid{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 80px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 80px);
  pointer-events:none;
}
.hero-content{
  position:absolute;bottom:0;left:0;right:0;padding:20px 16px 18px;
  z-index:2;color:#fff;
}
.hero-type-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 12px;border-radius:6px;
  background:rgba(0,32,159,.85);backdrop-filter:blur(6px);
  color:#fff;margin-bottom:10px;
}
.hero-title{
  font-family:var(--display);font-size:clamp(1.5rem,5vw,2.2rem);
  line-height:1.15;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.4);
}
.hero-date-loc{
  display:flex;flex-direction:column;gap:4px;font-size:.82rem;
  color:rgba(255,255,255,.8);
}
.hero-date-loc span{display:flex;align-items:center;gap:6px}
.hero-date-loc svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.hero-hosted{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;padding:5px 12px;border-radius:100px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);
  font-size:.72rem;font-weight:600;color:rgba(255,255,255,.85);
}

/* MAIN */
.main{max-width:640px;margin:0 auto;padding:0 16px 24px}

/* CARD */
.card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;margin-top:16px;
  box-shadow:var(--shadow-sm);
}
.card-title{
  font-family:var(--display);font-size:1.15rem;color:var(--dark);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card-title .icon{font-size:1.15rem}

/* EVENT INFO */
.info-rows{display:flex;flex-direction:column;gap:12px}
.info-row{display:flex;align-items:flex-start;gap:12px}
.info-icon{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.info-icon svg{width:18px;height:18px}
.info-icon.blue{background:rgba(0,32,159,.08);color:var(--blue)}
.info-icon.red{background:rgba(210,16,52,.08);color:var(--red)}
.info-icon.green{background:rgba(27,140,61,.08);color:var(--green)}
.info-icon.gold{background:rgba(212,160,23,.1);color:#8B6914}
.info-text{flex:1;min-width:0}
.info-text .label{font-size:.72rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.info-text .value{font-size:.9rem;font-weight:600;color:var(--text);margin-top:1px}
.info-text .value a{color:var(--blue);text-decoration:underline;text-decoration-color:rgba(0,32,159,.25)}

/* EVENT TYPE BADGE (in info card) */
.event-type-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:100px;
  font-size:.75rem;font-weight:700;
  background:rgba(0,32,159,.08);color:var(--blue);
  margin-top:4px;
}

/* SHARE BUTTONS */
.share-row{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-light)}
.share-btn{
  height:38px;padding:0 14px;border-radius:10px;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;gap:6px;transition:all .2s;flex:1;justify-content:center;
}
.share-btn svg{width:16px;height:16px;flex-shrink:0}
.share-btn.wa{background:#25D366;color:#fff}
.share-btn.wa:hover{background:#1DA851}
.share-btn.fb{background:#1877F2;color:#fff}
.share-btn.fb:hover{background:#1466D8}
.share-btn.copy{background:var(--off-white);color:var(--text);border:1px solid var(--border)}
.share-btn.copy:hover{background:var(--border-light);border-color:var(--text-muted)}
.share-btn.email{background:#EA4335;color:#fff}
.share-btn.email:hover{background:#D33426}

/* DESCRIPTION */
.desc-text{font-size:.88rem;color:var(--text-light);line-height:1.7;white-space:pre-line}
.desc-text.collapsed{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.read-more-btn{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:10px;font-size:.82rem;font-weight:700;color:var(--blue);
  padding:6px 0;transition:color .2s;
}
.read-more-btn:hover{color:var(--blue-light)}
.read-more-btn svg{width:14px;height:14px;transition:transform .2s}
.read-more-btn.expanded svg{transform:rotate(180deg)}

/* TICKETS */
.ticket-option{
  border:2px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;transition:all .25s;cursor:pointer;
  position:relative;overflow:hidden;
}
.ticket-option:hover{border-color:var(--blue-light);box-shadow:var(--shadow-sm)}
.ticket-option.selected{border-color:var(--blue);background:rgba(0,32,159,.02);box-shadow:0 0 0 3px rgba(0,32,159,.08)}
.ticket-option.selected::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));
}
.ticket-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.ticket-name{font-size:.92rem;font-weight:700;color:var(--dark)}
.ticket-price{
  font-size:1rem;font-weight:800;color:var(--dark);white-space:nowrap;
  display:flex;align-items:baseline;gap:3px;
}
.ticket-price .currency{font-size:.72rem;font-weight:600;color:var(--text-muted)}
.ticket-price.free{color:var(--green);font-size:.88rem}

/* RSVP. Deliberately large targets: this is tapped once, on a phone, often
   outdoors, by somebody who has never used the site before. */
.rsvp-btn{
  width:100%;padding:16px 18px;border-radius:14px;border:2px solid transparent;
  font-family:var(--body);font-size:1rem;font-weight:800;cursor:pointer;
  text-align:left;transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.rsvp-btn:active{transform:scale(.985)}
.rsvp-yes{background:var(--green,#00A651);color:#fff;box-shadow:0 6px 16px rgba(0,166,81,.28)}
.rsvp-yes:hover{background:#00913f}
.rsvp-no{background:#fff;color:var(--text,#0A0E1A);border-color:var(--border,#e3e6ee)}
.rsvp-no:hover{background:var(--off-white,#f6f7fb)}
.rsvp-btn.chosen{outline:3px solid rgba(0,32,159,.35);outline-offset:2px}
.rsvp-answer{
  background:var(--off-white,#f6f7fb);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:10px;
}
.rsvp-answer .headline{font-weight:800;font-size:1rem}
.rsvp-answer .sub{font-size:.85rem;color:var(--text-muted,#6b7280)}
.rsvp-link{
  display:inline-block;padding:11px 16px;border-radius:10px;background:var(--primary-blue,#00209F);
  color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;text-align:center;
}
.rsvp-change{background:none;border:none;color:var(--text-muted,#6b7280);font-size:.82rem;
  text-decoration:underline;cursor:pointer;font-family:var(--body);padding:0;text-align:left}
.ticket-desc{font-size:.78rem;color:var(--text-light);margin-bottom:10px;line-height:1.4}
.ticket-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket-avail{
  display:flex;align-items:center;gap:5px;
  font-size:.7rem;font-weight:600;color:var(--text-muted);
}
.ticket-avail .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.ticket-avail.low .dot{background:var(--gold)}
.ticket-avail.low{color:#8B6914}
.ticket-avail.soldout .dot{background:var(--red)}
.ticket-avail.soldout{color:var(--red)}
.qty-selector{
  display:flex;align-items:center;gap:0;
  border:1.5px solid var(--border);border-radius:10px;overflow:hidden;
  height:36px;
}
.qty-btn{
  width:36px;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:700;color:var(--text-light);
  transition:all .15s;background:var(--off-white);
}
.qty-btn:hover{background:var(--border-light);color:var(--blue)}
.qty-btn:active{background:var(--border)}
.qty-val{
  width:36px;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:.88rem;font-weight:800;color:var(--dark);
  border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);
  background:var(--white);
}

/* STICKY BOTTOM BAR */
.order-bar{
  position:fixed;bottom:56px;left:0;right:0;z-index:90;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transform:translateY(100%);opacity:0;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.order-bar.visible{transform:translateY(0);opacity:1;pointer-events:auto}
.order-info{display:flex;flex-direction:column;gap:2px}
.order-count{font-size:.75rem;font-weight:600;color:var(--text-light)}
.order-total{font-size:1.1rem;font-weight:800;color:var(--dark)}
.order-total .currency{font-size:.78rem;font-weight:600;color:var(--text-muted)}
.buy-btn{
  height:48px;padding:0 28px;border-radius:12px;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  color:#fff;font-size:.92rem;font-weight:800;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(210,16,52,.35);
  transition:all .25s;white-space:nowrap;
}
.buy-btn svg{width:18px;height:18px;flex-shrink:0}
.buy-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(210,16,52,.45)}
.buy-btn:active{transform:translateY(0)}

/* ORGANIZER */
.org-row{display:flex;align-items:center;gap:14px}
.org-avatar{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--blue-light));
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:800;color:#fff;
}
.org-info{flex:1;min-width:0}
.org-name{font-size:.92rem;font-weight:700;color:var(--dark)}
.org-label{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.org-actions{display:flex;gap:8px;margin-top:14px}
.org-btn{
  height:38px;padding:0 16px;border-radius:10px;
  font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:6px;
  transition:all .2s;
}
.org-btn svg{width:16px;height:16px;flex-shrink:0}
.org-btn.wa{background:#25D366;color:#fff}
.org-btn.wa:hover{background:#1DA851}
.org-btn.report{color:var(--text-muted);border:1px solid var(--border);background:var(--white);font-size:.72rem}
.org-btn.report:hover{border-color:var(--red);color:var(--red)}

/* KOUTYE BANNER */
.koutye-banner{
  background:linear-gradient(135deg,var(--dark),var(--blue-deep));
  border-radius:var(--radius-lg);padding:18px 20px;margin-top:16px;
  color:#fff;position:relative;overflow:hidden;
}
.koutye-banner::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 200px 200px at 90% 50%, rgba(212,160,23,.15), transparent);
  pointer-events:none;
}
.koutye-banner-inner{position:relative;z-index:1}
.koutye-banner-title{
  font-size:.88rem;font-weight:800;margin-bottom:4px;
  display:flex;align-items:center;gap:6px;
}
.koutye-banner-title .icon{font-size:1rem}
.koutye-banner-desc{font-size:.78rem;color:rgba(255,255,255,.65);line-height:1.5;margin-bottom:12px}
.koutye-btn{
  height:36px;padding:0 18px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),#C4900F);
  color:#fff;font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(212,160,23,.25);transition:all .2s;
}
.koutye-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,160,23,.35)}
.koutye-btn svg{width:14px;height:14px}

/* SIMILAR EVENTS */
.similar-scroll{
  display:flex;gap:12px;overflow-x:auto;overflow-y:visible;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:4px 0 8px;margin:0 -20px;padding-left:20px;padding-right:20px;
}
.similar-scroll::-webkit-scrollbar{display:none}
.sim-card{
  min-width:200px;max-width:220px;scroll-snap-align:start;flex-shrink:0;
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:all .25s;cursor:pointer;
}
.sim-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.sim-img{height:100px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.sim-date{
  position:absolute;top:8px;right:8px;
  background:var(--white);border-radius:8px;padding:4px 8px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.sim-date .month{font-size:.5rem;font-weight:700;text-transform:uppercase;color:var(--red);letter-spacing:.05em}
.sim-date .day{font-size:.88rem;font-weight:900;color:var(--dark);line-height:1}
.sim-body{padding:10px 12px}
.sim-title{font-size:.78rem;font-weight:700;color:var(--dark);margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sim-price{font-size:.78rem;font-weight:800;color:var(--blue)}
.sim-price.free{color:var(--green)}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);display:flex;height:56px;
}
.bottom-nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-muted);font-size:.6rem;font-weight:600;transition:color .2s;
  text-transform:uppercase;letter-spacing:.04em;
}
.bottom-nav a.active{color:var(--blue)}
.bottom-nav a svg{width:22px;height:22px}
.bottom-nav .create-tab{position:relative;margin-top:-12px}
.bottom-nav .create-dot{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(210,16,52,.3);
}
.bottom-nav .create-dot svg{color:#fff}

/* REVEAL */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:.08s}
.reveal-d2{transition-delay:.16s}
.reveal-d3{transition-delay:.24s}

/* RESPONSIVE */
@media(min-width:768px){
  .bottom-nav{display:none}
  body{padding-bottom:0}
  .order-bar{bottom:0}
  .order-bar .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;width:100%}
}
@media(min-width:500px){
  .hero-invite{aspect-ratio:2/1}
}

/* LANG BAR */
.lang-bar{background:var(--dark);padding:6px 20px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.68rem;z-index:1001;position:relative}
.lang-bar a{color:rgba(255,255,255,.5);padding:3px 12px;border-radius:100px;font-weight:600;transition:all .2s;cursor:pointer}
.lang-bar a:hover{color:#fff;background:rgba(255,255,255,.08)}
.lang-bar a.active{color:var(--gold);background:rgba(212,160,23,.15)}
</style>

<script>
/* ═══ LOAD EVENT DATA ═══ */
var demoEvent = {
  title: "Gran Konferans Teknoloji 2026",
  type: "konferans",
  typeLabel: "Konferans",
  typeEmoji: "🎤",
  date: "2026-06-15",
  startTime: "18:00",
  endTime: "22:00",
  location: "Karibe Hotel, Pétion-Ville",
  onlineLink: "",
  description: "Yon gwo konferans sou teknoloji ak inovasyon nan Ayiti. Vini aprann sou AI, fintech, e-commerce, ak plis ankò. Konekte ak lidè endistri a, startup fondatè, ak envèstisè.\n\nOratè envite:\n• Jean-Baptiste Pierre — CEO, TechHaiti\n• Marie Duval — Fondatè, FinPay Solutions\n• Roberto Charles — CTO, Caribbean Digital\n\nPatisipan yo ap resevwa yon sètifika prezans ak aksè a yon gwoup WhatsApp eksklizif pou netwòking apre evènman an.",
  organizer: "HaitiBiznis",
  organizerPhone: "+50946859702",
  hostedBy: "TechHaiti Community",
  koutyeEnabled: true,
  tickets: [
    { name: "General Admission", price: 500, desc: "Antre jeneral", qty: 200, sold: 152 },
    { name: "VIP", price: 2500, desc: "Tab VIP, manje ak bwason enkli", qty: 50, sold: 38 },
    { name: "Early Bird", price: 350, desc: "Pri espesyal pou premye 50 tikè", qty: 50, sold: 38 },
    { name: "Etidyan", price: 250, desc: "Montre kat etidyan ou", qty: 100, sold: 45 }
  ]
};

var API_URL = 'https://haitibiznis-api.onrender.com';

/* Where a shareable link points.
 *
 * The API host is the only server in the stack, so it has to serve the page
 * that carries the WhatsApp preview - haitibiznis.com is static files on
 * GitHub Pages and cannot. What CAN change is the name on the front of it: the
 * day a subdomain of his own domain points at the API, TL_SHARE_BASE becomes
 * that name and every link generated afterwards is branded. Links already
 * shared keep working; the old path still answers. */
var TL_SHARE_BASE = '';
function shareBase() { return TL_SHARE_BASE || API_URL; }

var event = demoEvent;
var needsAsyncLoad = false;

/* 🚨🚨 11 Oct 2026 — SOMEBODY'S REAL EVENT LINK SHOWED A FICTIONAL CONFERENCE.
   Jeffery: "if you are not registered yet its a technology conference event
   that pops up". He is right, and here is why.

   The page starts as demoEvent and the real one arrives later. A visitor who
   has used Tikè Lakay before has the event in localStorage, so the swap is
   instant and nobody notices. A FIRST-TIME visitor has nothing cached, so the
   page has to wait for the API - and the API is on a free tier that cold-starts
   in anything up to a minute.

   For that whole minute, somebody who clicked a WhatsApp link to the
   LajanMaker training was reading "Gran Konferans Teknoloji 2026", at the
   Karibe Hotel, with four invented ticket prices and 152 tickets sold.

   🔑 The failure case was already fixed - showLoadFailure() exists, with the
   right note on it: "Better an honest empty page than a convincing wrong one."
   The LOADING case was missed. Same fiction, different moment.

   So: the instant we know a real event is coming, the demo is thrown away.
   An empty frame that says "loading" is honest. A fictional conference with
   prices on it is not. */
function blankEvent() {
  return {
    title: '', type: '', typeLabel: '', typeEmoji: '⏳',
    date: '', startTime: '', endTime: '', location: '', onlineLink: '',
    description: '', organizer: '', organizerPhone: '', hostedBy: '',
    koutyeEnabled: false, tickets: [], _loading: true
  };
}

(function loadEventFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var evId = params.get('id');
  if (!evId) return;

  // Try localStorage first (instant)
  var found = false;
  try {
    var events = JSON.parse(localStorage.getItem('tl_events') || '[]');
    for (var i = 0; i < events.length; i++) {
      if (events[i].id === evId || events[i]._id === evId) {
        event = events[i];
        found = true;
        break;
      }
    }
  } catch(e) {}

  if (found) {
    if (!event.typeEmoji) event.typeEmoji = '📌';
    if (!event.typeLabel) event.typeLabel = event.type || 'Lòt';
    if (!event.koutyeEnabled) event.koutyeEnabled = false;
    if (event.tickets) event.tickets.forEach(function(t) { if (!t.sold) t.sold = 0; });
    return;
  }

  /* ⛔ Not cached, so a real event is on its way. Drop the demo NOW, before
     anything paints - not after the fetch returns. */
  needsAsyncLoad = evId;
  event = blankEvent();
})();

/* The tickets area while we wait. Mirrors showLoadFailure(): say what is
   happening, and show no price that is not real. */
/* 🚨 AND THE MESSAGE HAS TO BE SOMEWHERE SHE CAN SEE IT.
   Writing into #ticketsList is not enough. An event with no tickets looks FREE
   to isFreeEvent(), so setupRsvp() hides the whole tickets card and shows the
   RSVP card instead. A blank event-while-loading is exactly that shape - so
   the first version of this wrote an honest message into a hidden box, and the
   visitor was asked "are you going?" about a paid event we had not loaded yet.
   ⛔ Put the card back before writing into it. showLoadFailure() had the same
   hole and gets the same treatment. */
function showStatusInTickets(message) {
  var tcard = document.getElementById('ticketsCard');
  var rcard = document.getElementById('rsvpCard');
  if (tcard) tcard.style.display = '';
  if (rcard) rcard.style.display = 'none';
  var list = document.getElementById('ticketsList');
  if (list) {
    list.innerHTML = '<div style="padding:18px;text-align:center;color:var(--text-muted);' +
      'border:1px dashed var(--border);border-radius:12px">' + message + '</div>';
  }
  var buy = document.querySelector('.buy-btn');
  if (buy) buy.style.display = 'none';      /* nothing to buy until we know what */
}

function showLoadingState() {
  showStatusInTickets(t('loading') || 'N ap chaje evènman an…');
}

function loadEventFromAPI(evId) {
  fetch(API_URL + '/api/events/' + evId)
    .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(function(data) {
      event = data;
      if (!event.typeEmoji) event.typeEmoji = '📌';
      if (!event.typeLabel) event.typeLabel = event.type || 'Lòt';
      if (!event.koutyeEnabled) event.koutyeEnabled = false;
      if (event.tickets) event.tickets.forEach(function(t) { if (!t.sold) t.sold = 0; });
      ticketQty = [];
      event.tickets.forEach(function() { ticketQty.push(0); });
      /* Kept OUT of the promise chain below. renderPage() used to be inside
         it, so anything it threw landed in an empty .catch and the page went
         on showing the sample event this file ships with - sample tickets,
         sample prices, on somebody's real event page. */
      try {
        renderPage();
      } catch (e) {
        console.error('renderPage failed on live event data', e);
        showLoadFailure();
      }
    })
    .catch(function(e) {
      console.error('could not load event ' + evId, e);
      showLoadFailure();
    });
}

/* Better an honest empty page than a convincing wrong one. Without this the
   fallback was a fictional conference with four ticket prices on it. */
function showLoadFailure() {
  showStatusInTickets(
    t('loadFailed') || 'Nou pa ka chaje evènman sa a kounye a. Tanpri eseye ankò.');
}

/* Similar events demo */

  { title: "Gala Solidarité", date: "2026-08-22", price: 5000, emoji: "💝", gradient: "linear-gradient(135deg,#1a3a1a,#D4A017,#E8B82E)", month: "AOU", day: "22" },

function t(key) {
  return (translations[currentLang] && translations[currentLang][key]) || translations.ht[key] || key;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('tl_lang', lang);

  /* Update lang-bar active state */
  document.querySelectorAll('.lang-bar a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('data-lang') === lang);
  });

  /* Update all static data-i18n elements */
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (key === 'brand') {
      el.innerHTML = t(key);
    } else {
      el.textContent = t(key);
    }
  });

  /* Re-render dynamic content with new language */
  renderPage();

  /* Update read more/less button based on current state */
  var label = document.getElementById('readMoreLabel');
  if (label) {
    label.textContent = descExpanded ? t('readLess') : t('readMore');
  }
}

/* Attach lang-bar click handlers */
document.querySelectorAll('.lang-bar a').forEach(function(a) {
  a.addEventListener('click', function() {
    setLang(this.getAttribute('data-lang'));
  });
});

var dayNames = {
  ht: ['Dimanch','Lendi','Madi','Mèkredi','Jedi','Vandredi','Samdi'],
  fr: ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'],
  en: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  es: ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],
  pt: ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado']
};
var monthNames = {
  ht: ['Jan','Fev','Mas','Avr','Mai','Jun','Jiy','Aou','Sep','Okt','Nov','Des'],
  fr: ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'],
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  es: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],
  pt: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']
};

/* ⚠️ formatTime() below already refuses an empty value. This did not, and the
   difference showed: with no date it built "undefined, NaN undefined NaN" out
   of an Invalid Date and printed it on the page. I hit it with the loading
   placeholder, but a real event saved without a date would have done the same
   thing. Guarded here, so every caller is covered rather than each one
   remembering. */
function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  var days = dayNames[currentLang] || dayNames.ht;
  var months = monthNames[currentLang] || monthNames.ht;
  return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

/* An event saved with no end time made this throw, and the throw happened
   inside renderPage() which is called from a .then() whose .catch was empty.
   The hero had already been written, so the page looked fine - and everything
   from the info card down, INCLUDING THE TICKET LIST, stayed on the demo data
   this file ships with. A free workshop was showing the public a General
   Admission ticket at HTG 500 that does not exist. */
function formatTime(t) {
  if (!t) return '';
  var parts = String(t).split(':');
  if (parts.length < 2) return '';
  var h = parseInt(parts[0]);
  var m = parts[1];
  var ampm = h >= 12 ? 'PM' : 'AM';
  if (h > 12) h -= 12;
  if (h === 0) h = 12;
  return h + ':' + m + ' ' + ampm;
}

function formatPrice(p) {
  return p.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/* renderPage runs twice when the event arrives from the API, so this has to be
   safe to call again. */
function showInvite() {
  var src = event && event.inviteImage;
  var hero = document.getElementById('heroInvite');
  if (!hero || typeof src !== 'string' || src.indexOf('data:image') !== 0) return;
  var img = document.getElementById('heroInviteImg');
  if (!img) {
    img = document.createElement('img');
    img.id = 'heroInviteImg';
    img.className = 'hero-invite-img';
    img.onload = function() {
      if (img.naturalWidth && img.naturalHeight) {
        hero.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight;
      }
    };
    hero.insertBefore(img, hero.firstChild);
  }
  img.alt = event.title || '';
  if (img.getAttribute('src') !== src) img.src = src;
  hero.classList.add('has-invite');
}

/* ═══ RENDER PAGE ═══ */
function renderPage() {
  /* The invitation he designs in step 2 was being saved to the database and
     then shown to nobody - this page drew a gradient and ignored it. If there
     is a picture, the picture IS the hero, at its own shape, and our own title
     strip comes off it: the info card underneath already carries the title,
     the date, the place and the type. */
  showInvite();

  /* Hero */
  document.getElementById('heroType').innerHTML = typeEmojiOf(event) + ' ' + typeLabelOf(event);
  document.getElementById('heroTitle').textContent = event.title;
  document.getElementById('heroDateText').textContent = formatDate(event.date) + ' · ' + formatTime(event.startTime);
  document.getElementById('heroLocText').textContent = event.location;
  if (event.hostedBy) {
    document.getElementById('heroHosted').innerHTML = '👤 ' + t('hostedBy') + ' <strong>' + event.hostedBy + '</strong>';
  } else {
    document.getElementById('heroHosted').style.display = 'none';
  }

  /* Info Card */
  document.getElementById('infoTitle').textContent = event.title;
  var infoHtml = '';

  /* Date + Time. No end time means no dash - "08:00 - " reads like the page
     lost something. */
  var timeText = formatTime(event.startTime);
  var endText = formatTime(event.endTime);
  if (timeText && endText) timeText += ' - ' + endText;
  else if (!timeText && endText) timeText = endText;
  infoHtml += '<div class="info-row">' +
    '<div class="info-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>' +
    '<div class="info-text"><div class="label">' + t('dateTime') + '</div><div class="value">' + formatDate(event.date) + (timeText ? ' · ' + timeText : '') + '</div></div></div>';

  /* Location */
  infoHtml += '<div class="info-row">' +
    '<div class="info-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>' +
    '<div class="info-text"><div class="label">' + t('location') + '</div><div class="value">' + event.location + '</div></div></div>';

  /* Online Link */
  if (event.onlineLink) {
    infoHtml += '<div class="info-row">' +
      '<div class="info-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div>' +
      '<div class="info-text"><div class="label">' + t('onlineLink') + '</div><div class="value"><a href="' + event.onlineLink + '" target="_blank">' + event.onlineLink + '</a></div></div></div>';
  }

  /* Event Type */
  infoHtml += '<div class="info-row">' +
    '<div class="info-icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div>' +
    '<div class="info-text"><div class="label">' + t('eventType') + '</div><div class="event-type-pill">' + typeEmojiOf(event) + ' ' + typeLabelOf(event) + '</div></div></div>';

  document.getElementById('infoRows').innerHTML = infoHtml;

  /* Description */
  document.getElementById('descText').textContent = event.description;

  /* Tickets, or - for a free event - the two RSVP buttons instead. */
  renderTickets();
  setupRsvp();

  /* Organizer - an event saved without one used to throw here, and everything
     below this line (the koutye banner, the similar events, the tab title)
     silently stopped rendering. */
  var org = event.organizer || event.hostedBy || '';
  document.getElementById('orgAvatar').textContent = org.charAt(0) || '·';
  document.getElementById('orgName').textContent = org;

  /* Koutye Banner */
  if (event.koutyeEnabled) {
    document.getElementById('koutyeBanner').style.display = 'block';
  }

  /* Similar Events */
  renderSimilar();

  /* Page title */
  document.title = event.title + ' — Tikè Lakay';
}

/* ═══ RSVP - free events ═══════════════════════════════════════════════════
 *
 * The Academy director, who is about to run a month of free
 * workshops: for free events, registration should not require a ticket
 * purchase flow. Two buttons. Yes, I'm Coming. No, I Can't Make It.
 *
 * What "free" means here is every ticket priced at zero, or no ticket types at
 * all. A mixed event - a free tier and a paid VIP tier - keeps the ticket
 * selector, because there is genuinely something to buy.
 *
 * Tapping Yes still issues the free ticket underneath, so the person arrives
 * with a QR code and the door works exactly as it does for a paid event. The
 * difference is entirely in what they are asked to do: one tap and their name,
 * rather than a quantity selector, a fee line and a payment method.
 */
function isFreeEvent() {
  if (!event || !event.tickets || !event.tickets.length) return true;
  return event.tickets.every(function(tk) { return !tk.price || tk.price === 0; });
}

function rsvpPhoneStore(v) {
  try {
    if (v === undefined) return localStorage.getItem('tl_phone') || '';
    localStorage.setItem('tl_phone', v);
  } catch (e) {}
  return v || '';
}

function setupRsvp() {
  var card = document.getElementById('rsvpCard');
  var tcard = document.getElementById('ticketsCard');
  if (!card || !tcard) return;
  if (!isFreeEvent()) { card.style.display = 'none'; tcard.style.display = ''; return; }

  card.style.display = '';
  tcard.style.display = 'none';

  document.getElementById('rsvpTitleTxt').textContent = t('rsvpTitle');
  document.getElementById('rsvpDescTxt').textContent = t('rsvpDesc');
  var btns = document.querySelectorAll('#rsvpButtons .rsvp-btn');
  if (btns[0]) btns[0].textContent = t('rsvpYes');
  if (btns[1]) btns[1].textContent = t('rsvpNo');

  showRsvpCount(event.rsvpGoing, event.rsvpAttending);

  /* If this phone has answered before, show them their own answer rather than
     asking again. The number is remembered from the last registration on this
     device - it is the same person on the same phone. */
  var known = rsvpPhoneStore();
  if (known) {
    fetch(API_URL + '/api/events/' + event._id + '/rsvp/me?phone=' + encodeURIComponent(known))
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.response) showRsvpAnswer(d.response, null);
        showRsvpCount(d.going, d.attending);
      })
      .catch(function() {});
  }
}

function showRsvpCount(going, attending) {
  var el = document.getElementById('rsvpCount');
  if (!el) return;
  var n = attending || going || 0;
  if (!n) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = '🙋 ' + n + ' ' + (n === 1 ? t('rsvpGoingOne') : t('rsvpGoingMany'));
}

function showRsvpAnswer(response, ref) {
  document.getElementById('rsvpButtons').style.display = 'none';
  var box = document.getElementById('rsvpDone');
  box.style.display = '';
  var html = '<div class="rsvp-answer">' +
    '<div class="headline">' + (response === 'yes' ? '✅ ' + t('rsvpYouSaidYes') : '❌ ' + t('rsvpYouSaidNo')) + '</div>' +
    '<div class="sub">' + (response === 'yes' ? t('rsvpThanksYes') : t('rsvpThanksNo')) + '</div>';
  if (response === 'yes' && ref) {
    html += '<a class="rsvp-link" href="ticket.html?ref=' + encodeURIComponent(ref) + '">🎟️ ' + t('rsvpTicketLink') + '</a>';
  }
  html += '<button class="rsvp-change" onclick="resetRsvp()">' + t('rsvpChange') + '</button>';
  html += '</div>';
  box.innerHTML = html;
}

function resetRsvp() {
  document.getElementById('rsvpDone').style.display = 'none';
  document.getElementById('rsvpButtons').style.display = 'flex';
}

function openRsvp(response) {
  var yes = response === 'yes';
  var modal = document.createElement('div');
  modal.id = 'rsvpModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
  var known = rsvpPhoneStore();
  modal.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:24px;position:relative">' +
    '<button onclick="this.closest(\'#rsvpModal\').remove()" style="position:absolute;top:12px;right:12px;font-size:1.2rem;background:none;border:none;cursor:pointer">✕</button>' +
    '<h3 style="font-family:var(--display);margin-bottom:8px">' + (yes ? '✅ ' + t('rsvpYesTitle') : '❌ ' + t('rsvpNoTitle')) + '</h3>' +
    '<div style="font-size:.85rem;color:var(--text-muted);margin-bottom:14px">' +
      (yes ? t('freeNote') : t('rsvpNoNote')) + '</div>' +
    (yes ? '<input id="rsvpName" placeholder="' + t('yourName') + '" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-family:var(--body)">' : '') +
    '<input id="rsvpPhone" type="tel" value="' + known.replace(/"/g, '&quot;') + '" placeholder="' + t('yourPhone') + '" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-family:var(--body)">' +
    (yes ? '<div style="margin-top:10px"><label style="font-size:.82rem;color:var(--text-muted);display:block;margin-bottom:4px">' + t('rsvpGuests') + '</label>' +
           '<input id="rsvpGuests" type="number" min="1" max="20" value="1" oninput="renderGuestNames()" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-family:var(--body)">' +
           '<div id="rsvpGuestNames"></div></div>' : '') +
    '<button id="rsvpSendBtn" onclick="sendRsvp(\'' + response + '\')" style="width:100%;margin-top:14px;padding:13px;border-radius:10px;font-weight:800;font-size:.95rem;border:none;background:' + (yes ? 'var(--green,#00A651)' : 'var(--primary-blue,#00209F)') + ';color:#fff;cursor:pointer;font-family:var(--body)">' + t('rsvpSend') + '</button>' +
    '<div id="rsvpError" style="color:#D21034;font-size:.85rem;margin-top:8px;display:none"></div></div>';

/* 🚨 25 Sep, Jeffery: "When an attendee RSVP +1 or 2 they should the option to
   put the name of the extra people."
   A number tells the organiser how many chairs to put out. It does not tell
   the person on the door who is allowed through - which is exactly the problem
   Jennifer hit with 22 answers and 26 people.
   Boxes appear as the count goes up, and anything already typed is kept, so
   changing 2 to 3 does not wipe the name you just entered. Optional on
   purpose: nobody is stopped from saying yes because they have not asked a
   friend's surname yet. */
function renderGuestNames() {
  var wrap = document.getElementById('rsvpGuestNames');
  var countEl = document.getElementById('rsvpGuests');
  if (!wrap || !countEl) return;
  var extra = Math.max(0, Math.min(19, (parseInt(countEl.value) || 1) - 1));
  var kept = Array.prototype.map.call(
    wrap.querySelectorAll('input'), function (i) { return i.value; });
  var html = '';
  for (var i = 0; i < extra; i++) {
    html += '<input class="rsvp-guest-name" type="text" maxlength="80" placeholder="' +
            t('rsvpGuestName').replace('{n}', i + 1) +
            '" style="width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);' +
            'border-radius:8px;font-family:var(--body)">';
  }
  wrap.innerHTML = html;
  var boxes = wrap.querySelectorAll('input');
  for (var j = 0; j < boxes.length; j++) if (kept[j]) boxes[j].value = kept[j];
}

function collectGuestNames() {
  var wrap = document.getElementById('rsvpGuestNames');
  if (!wrap) return [];
  return Array.prototype.map.call(wrap.querySelectorAll('input'), function (i) {
    return (i.value || '').trim();
  }).filter(function (x) { return x; });
}

function sendRsvp(response) {
  var yes = response === 'yes';
  var phoneEl = document.getElementById('rsvpPhone');
  var nameEl = document.getElementById('rsvpName');
  var guestEl = document.getElementById('rsvpGuests');
  var err = document.getElementById('rsvpError');
  var btn = document.getElementById('rsvpSendBtn');

  var phone = (phoneEl && phoneEl.value || '').trim();
  var name = (nameEl && nameEl.value || '').trim();

  /* Eight digits is a Haitian mobile. Checked here so the person is told at
     once instead of after a round trip. */
  if (phone.replace(/\D/g, '').length < 8) {
    err.textContent = t('needNamePhone');
    err.style.display = '';
    return;
  }
  if (yes && !name) {
    err.textContent = t('needNamePhone');
    err.style.display = '';
    return;
  }

  btn.disabled = true;
  btn.style.opacity = '.6';
  err.style.display = 'none';
  rsvpPhoneStore(phone);

  var guests = guestEl ? Math.max(1, parseInt(guestEl.value) || 1) : 1;

  fetch(API_URL + '/api/events/' + event._id + '/rsvp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ response: response, name: name, phone: phone, guests: guests,
                           guest_names: collectGuestNames() })
  })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
    .then(function(res) {
      if (!res.ok) {
        /* 🚨 The event can now be FULL. The server answers in English; the
           person reading it may not. Build the sentence here, where the
           language is known, from the numbers the server sent. */
        var d = res.d || {};
        if (d.full) {
          var msg = (d.places_left > 0)
            ? t('rsvpOnlyLeft').replace('{n}', d.places_left)
            : t('rsvpFull');
          var e2 = new Error(msg); e2.handled = true; throw e2;
        }
        throw new Error(d.error || 'failed');
      }
      showRsvpCount(res.d.going, res.d.attending);
      var m = document.getElementById('rsvpModal');

      /* A "no" is finished here. A "yes" still gets a real ticket with a QR
         code, so the door works the same way it does for a paid event - the
         person just was not made to walk through a checkout to get it. */
      if (!yes) {
        if (m) m.remove();
        showRsvpAnswer('no', null);
        return;
      }
      return fetch(API_URL + '/api/payments/buy-ticket', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          eventId: event._id,
          ticketName: (event.tickets && event.tickets[0] && event.tickets[0].name) || 'Gratis',
          qty: guests,
          buyerName: name,
          buyerPhone: phone,
          paymentMethod: 'moncash'
        })
      })
        .then(function(r) { return r.json(); })
        .then(function(tk) {
          if (m) m.remove();
          /* If the ticket could not be issued the registration itself is still
             recorded and the organiser still has the name. Say so plainly
             rather than pretending there is a ticket to open. */
          showRsvpAnswer('yes', tk && tk.referenceId ? tk.referenceId : null);
        });
    })
    .catch(function(e) {
      btn.disabled = false;
      btn.style.opacity = '';
      err.textContent = e.message || 'Error';
      err.style.display = '';
    });
}

/* The event type, in the language the reader chose - not the language of
   whoever created the event. See event-types.js for why this is not simply
   event.typeLabel any more. A type the organiser typed themselves comes back
   exactly as they typed it. */
function typeLabelOf(ev) {
  if (window.EventTypes) return EventTypes.label(ev, currentLang);
  return (ev && ((ev.typeCustom || '').trim() || ev.typeLabel)) || '';
}
function typeEmojiOf(ev) {
  if (window.EventTypes) return EventTypes.emoji(ev);
  return (ev && ev.typeEmoji) || '\ud83d\udccc';
}

function renderTickets() {
  var html = '';
  event.tickets.forEach(function(tk, i) {
    var remaining = tk.qty - tk.sold;
    var availClass = '';
    var availText = remaining + ' ' + t('spotsLeft');
    if (remaining <= 15) { availClass = ' low'; availText = remaining + ' ' + t('spotsLeft') + ' — ' + t('goingFast'); }
    if (remaining <= 0) { availClass = ' soldout'; availText = t('soldOut'); }

    var isSelected = ticketQty[i] > 0;

    html += '<div class="ticket-option' + (isSelected ? ' selected' : '') + '" id="ticket' + i + '" onclick="selectTicket(' + i + ')">';
    html += '<div class="ticket-top">';
    html += '<div class="ticket-name">' + tk.name + '</div>';
    if (tk.price === 0) {
      html += '<div class="ticket-price free">GRATIS</div>';
    } else {
      html += '<div class="ticket-price"><span class="currency">HTG</span> ' + formatPrice(tk.price) + '</div>';
    }
    html += '</div>';
    /* 🚨 4 Oct, event day: tk.desc is optional and this printed the literal
       word "undefined" under the price on the live ticket card - today's
       training had no description, so every buyer saw it. Only draw the line
       when there is something to put in it. */
    if (tk.desc) html += '<div class="ticket-desc">' + tk.desc + '</div>';
    html += '<div class="ticket-bottom">';
    html += '<div class="ticket-avail' + availClass + '"><span class="dot"></span> ' + availText + '</div>';
    if (remaining > 0) {
      html += '<div class="qty-selector" onclick="event.stopPropagation()">';
      html += '<button class="qty-btn" onclick="changeQty(' + i + ',-1)">-</button>';
      html += '<div class="qty-val" id="qtyVal' + i + '">' + ticketQty[i] + '</div>';
      html += '<button class="qty-btn" onclick="changeQty(' + i + ',1)">+</button>';
      html += '</div>';
    }
    html += '</div></div>';
  });
  document.getElementById('ticketsList').innerHTML = html;
}

/* ═══ TICKET INTERACTIONS ═══ */
function selectTicket(idx) {
  var remaining = event.tickets[idx].qty - event.tickets[idx].sold;
  if (remaining <= 0) return;
  if (ticketQty[idx] === 0) {
    ticketQty[idx] = 1;
    renderTickets();
    updateOrderBar();
  }
}

function changeQty(idx, delta) {
  var remaining = event.tickets[idx].qty - event.tickets[idx].sold;
  var newVal = ticketQty[idx] + delta;
  if (newVal < 0) newVal = 0;
  if (newVal > Math.min(remaining, 10)) newVal = Math.min(remaining, 10);
  ticketQty[idx] = newVal;
  renderTickets();
  updateOrderBar();
}

/* ═══ ORDER BAR ═══ */
function updateOrderBar() {
  var totalQty = 0;
  var totalPrice = 0;
  ticketQty.forEach(function(q, i) {
    totalQty += q;
    totalPrice += q * event.tickets[i].price;
  });

  var bar = document.getElementById('orderBar');
  if (totalQty > 0) {
    bar.classList.add('visible');
    document.getElementById('orderCount').textContent = totalQty + ' ' + t('ticketSuffix');
    document.getElementById('orderTotal').textContent = formatPrice(totalPrice);
  } else {
    bar.classList.remove('visible');
  }
}

/* ═══ DESCRIPTION TOGGLE ═══ */
var descExpanded = false;
function toggleDesc() {
  descExpanded = !descExpanded;
  var el = document.getElementById('descText');
  var btn = document.getElementById('readMoreBtn');
  var label = document.getElementById('readMoreLabel');
  if (descExpanded) {
    el.classList.remove('collapsed');
    label.textContent = t('readLess');
    btn.classList.add('expanded');
  } else {
    el.classList.add('collapsed');
    label.textContent = t('readMore');
    btn.classList.remove('expanded');
  }
}

/* ═══ SHARE ═══ */
function getShareUrl() {
  var evId = new URLSearchParams(window.location.search).get('id') || (event._id || event.id);
  /* /e/<id> rather than /api/events/<id>/share: this string is what lands in
     somebody's WhatsApp, and it should look like a link to an event. */
  return evId ? shareBase() + '/e/' + evId : window.location.href;
}

/* The hour, written the same way everywhere. shareEmail already showed it and
   shareWhatsApp did not, which is backwards: in Haiti the WhatsApp share is the
   one that actually gets used. */
/* No calendar emoji on the date line.
   U+1F4C5 is a PICTURE of a calendar with a date already drawn on it - Samsung
   draws 24 February, Apple draws 17 July - and it sits directly beside the real
   date. Jeffery's agents read the emoji, not the text, and asked why the
   training had moved to the 24th. There is no way to make it show the right
   day, so the date line carries no emoji at all. The clock and the pin are
   safe: neither has a number on it. */
function eventWhen() {
  var t = [event.startTime, event.endTime].filter(Boolean).join(' – ');
  return formatDate(event.date) + (t ? '\n⏰ ' + t : '');
}

function shareWhatsApp() {
  var url = getShareUrl();
  var text = (event.typeEmoji || '🎤') + ' ' + event.title + '\n' + eventWhen() + '\n📍 ' + event.location + '\n\nAchte tikè sou Tikè Lakay!\n' + url;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function shareFacebook() {
  window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(getShareUrl()), '_blank');
}

function shareEmail() {
  var subject = (event.typeEmoji || '') + ' ' + event.title + ' — Tikè Lakay';
  var body = event.title + '\n\n' +
    '' + formatDate(event.date) + ' · ' + (event.startTime || '') + (event.endTime ? ' – ' + event.endTime : '') + '\n' +
    '📍 ' + (event.location || '') + '\n\n' +
    (event.description ? event.description + '\n\n' : '') +
    'Achte tikè sou Tikè Lakay!\n' + getShareUrl();
  window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

function copyLink() {
  navigator.clipboard.writeText(getShareUrl()).then(function() {
    var btn = document.querySelector('.share-btn.copy');
    var orig = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:16px;height:16px"><polyline points="20 6 9 17 4 12"/></svg> <span>' + t('copied') + '</span>';
    btn.style.background = 'var(--green-light)';
    btn.style.borderColor = 'var(--green)';
    btn.style.color = 'var(--green)';
    setTimeout(function() {
      btn.innerHTML = orig;
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2000);
  });
}

/* ═══ BUY TICKETS ═══ */
function buyTickets() {
  var totalQty = 0;
  var totalPrice = 0;
  var selectedTicket = null;
  ticketQty.forEach(function(q, i) {
    if (q > 0) {
      totalQty += q;
      totalPrice += q * event.tickets[i].price;
      selectedTicket = { name: event.tickets[i].name, qty: q, price: event.tickets[i].price };
    }
  });
  if (!totalQty) return alert(t('selectTicket') || 'Chwazi omwen 1 tikè');
  if (totalPrice === 0) {
    showFreeModal(selectedTicket);
    return;
  }
  showPaymentModal(selectedTicket, totalPrice);
}

/* A free ticket used to go straight to processPayment from here. The name and

/* A ticket with no name on it cannot be checked at a door, paid or free. Both
   boxes were on screen for a paid ticket already; nothing was ever asserting
   they had been filled in. */
function requireBuyer() {
  var n = document.getElementById('buyerName');
  var p = document.getElementById('buyerPhone');
  if (!n || !p) return true;
  var err = document.getElementById('payError');
  var empty = !n.value.trim() ? n : (!p.value.trim() ? p : null);
  if (!empty) return true;
  if (err) { err.textContent = t('needNamePhone') || 'Mete non ou ak nimewo telefòn ou'; err.style.display = ''; }
  empty.style.borderColor = '#D21034';
  empty.focus();
  return false;
}

function showPaymentModal(ticket, total) {
  /* 🔑 MUST MATCH THE SERVER. haitibiznis-backend/routes/payments.js charges
     PLATFORM_FEE_PCT and adds it on top; if this number drifts from that one
     the buyer is quoted one figure and charged another. */
  var fee = Math.round(total * 0.075);
  var grandTotal = total + fee;
  var modal = document.createElement('div');
  modal.id = 'paymentModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:24px;position:relative">' +
    '<button onclick="this.closest(\'#paymentModal\').remove()" style="position:absolute;top:12px;right:12px;font-size:1.2rem;background:none;border:none;cursor:pointer">✕</button>' +
    '<h3 style="font-family:var(--display);margin-bottom:16px">💳 ' + (t('choosePayment') || 'Chwazi Metòd Peman') + '</h3>' +
    '<div style="background:var(--off-white);border-radius:10px;padding:12px;margin-bottom:16px">' +
    '<div style="display:flex;justify-content:space-between;font-size:.9rem"><span>' + ticket.qty + 'x ' + ticket.name + '</span><span>HTG ' + formatPrice(total) + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted);margin-top:4px"><span>' + (t('platformFee') || 'Frè platfòm (7.5%)') + '</span><span>HTG ' + formatPrice(fee) + '</span></div>' +
    '<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">' +
    '<div style="display:flex;justify-content:space-between;font-weight:700"><span>Total</span><span>HTG ' + formatPrice(grandTotal) + '</span></div></div>' +
    '<div style="margin-bottom:12px"><input id="buyerName" placeholder="' + (t('yourName') || 'Non ou') + '" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-family:var(--body)">' +
    '<input id="buyerPhone" placeholder="' + (t('yourPhone') || 'Nimewo telefòn') + '" type="tel" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-family:var(--body)">' +
    /* OPTIONAL, and it says so. The server can now email a ticket, but this
       checkout has only ever asked for a phone number - so there was no
       address to send to. Optional because a great many buyers here do not
       have an email at all, and making it required would stop them buying. */
    '<input id="buyerEmail" placeholder="' + (t('yourEmail') || 'Imèl ou (opsyonèl)') + '" type="email" inputmode="email" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:var(--body)">' +
    '<div style="font-size:.74rem;color:var(--text-muted);margin-top:6px;line-height:1.45">' +
      (t('emailWhyTicket') || 'Si w mete imèl ou, n ap voye tikè a ba ou tou.') + '</div>' +
    /* 15 Oct 2026, Jeffery: buyers must know how to get their ticket back even
       with no email and no WhatsApp. Said BEFORE they pay, because the page
       after MonCash is the least reliable step on a Haitian phone. */
    '<div style="font-size:.78rem;color:var(--text);margin-top:8px;line-height:1.45;background:#F0F7FF;border-radius:8px;padding:8px 10px">' +
      t('findTicketLater') + '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px" id="payMethodBtns">' +
    '<button onclick="processPayment(\'moncash\')" style="padding:12px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;background:#E31937;color:#fff;cursor:pointer;font-family:var(--body)">📱 MonCash</button>' +
    '<button onclick="processPayment(\'natcash\')" style="padding:12px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;background:#00A651;color:#fff;cursor:pointer;font-family:var(--body)">📱 NatCash</button>' +
    '<button onclick="processPayment(\'card\')" style="padding:12px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;background:#1a2a4a;color:#fff;cursor:pointer;font-family:var(--body)">💳 ' + (t('creditCard') || 'Kat Kredi') + '</button>' +
    '</div><div id="payError" style="color:#D21034;font-size:.85rem;margin-top:8px;display:none"></div></div>';
  document.body.appendChild(modal);
  window._selectedTicket = ticket;
}

function processPayment(method, freeTicket) {
  var ticket = freeTicket || window._selectedTicket;
  if (!ticket) return;
  if (!requireBuyer()) return;
  var evId = new URLSearchParams(window.location.search).get('id') || (event._id || event.id);
  var body = {
    eventId: evId, ticketName: ticket.name, qty: ticket.qty,
    paymentMethod: method,
    buyerName: document.getElementById('buyerName') ? document.getElementById('buyerName').value : '',
    buyerPhone: document.getElementById('buyerPhone') ? document.getElementById('buyerPhone').value : '',
    buyerEmail: document.getElementById('buyerEmail') ? document.getElementById('buyerEmail').value.trim() : ''
  };
  var btns = document.getElementById('payMethodBtns');
  if (btns) btns.style.opacity = '0.5';
  fetch(API_URL + '/api/payments/buy-ticket', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.free) {
      window.location.href = 'ticket.html?ref=' + data.referenceId;
      return;
    }
    if (data.paymentUrl) {
      window.location.href = data.paymentUrl;
    } else {
      var errEl = document.getElementById('payError');
      if (errEl) { errEl.textContent = data.error || 'Erè peman'; errEl.style.display = ''; }
      if (btns) btns.style.opacity = '1';
    }
  }).catch(function(err) {
    var errEl = document.getElementById('payError');
    if (errEl) { errEl.textContent = 'Erè koneksyon'; errEl.style.display = ''; }
    if (btns) btns.style.opacity = '1';
  });
}

/* ═══ ORGANIZER ═══ */
function contactOrganizer() {
  var text = 'Bonjou! Mwen enterese nan evènman "' + event.title + '" sou Tikè Lakay.';
  window.open('https://wa.me/' + event.organizerPhone.replace('+', '') + '?text=' + encodeURIComponent(text), '_blank');
}

function reportEvent() {
  alert('Rapòte evènman sa a? Fonksyon sa a ap vini byento. Kontakte support@haitibiznis.com.');
}

/* ═══ KOUTYE ═══ */
function shareKoutye() {
  var text = '💰 Touche komisyon lè ou pataje evènman sa a!\n\n🎤 ' + event.title + '\n' + eventWhen() + '\n\nAchte tikè: ' + window.location.href + '&ref=koutye';
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

/* ═══ RENDER SIMILAR EVENTS ═══ */
function renderSimilar() {
  var html = '';
  similarEvents.forEach(function(ev) {
    var priceText = ev.price === 0 ? '<span class="sim-price free">GRATIS</span>' : '<span class="sim-price">HTG ' + formatPrice(ev.price) + '</span>';
    html += '<a href="event.html" class="sim-card">' +
      '<div class="sim-img" style="background:' + ev.gradient + '">' + ev.emoji +
      '<div class="sim-date"><div class="month">' + ev.month + '</div><div class="day">' + ev.day + '</div></div></div>' +
      '<div class="sim-body"><div class="sim-title">' + ev.title + '</div>' + priceText + '</div></a>';
  });
  document.getElementById('similarEvents').innerHTML = html;
}

/* ═══ SCROLL REVEAL ═══ */
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });

/* ═══ INIT ═══ */
/* Set initial language from localStorage (or default ht) */
setLang(currentLang);

if (needsAsyncLoad) {
  /* setLang() above has already painted the page once. With event blanked it
     paints an empty frame rather than the demo, and this puts an honest
     message where the invented ticket prices used to be. */
  showLoadingState();
  loadEventFromAPI(needsAsyncLoad);
}
</script>
