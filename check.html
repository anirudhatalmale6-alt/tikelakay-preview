<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#00209F;--red:#D21034;--green:#1B8C3D;--gold:#D4A017;
  --white:#FFFFFF;--off-white:#F5F7FA;
  --dark:#0A0E1A;--text:#1A2A4A;--text-light:#5A6B8A;--text-muted:#8A95AA;
  --border:#E2E8F0;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
  --radius:14px;
}
body{font-family:var(--body);background:var(--off-white);color:var(--text);
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button,input{font-family:var(--body)}
.flag-stripe{height:4px;background:linear-gradient(90deg,var(--blue) 50%,var(--red) 50%)}

.topbar{background:var(--white);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-size:1rem;color:var(--dark)}
.brand em{color:var(--red);font-style:italic}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--border);background:var(--white);color:var(--text-light);
  border-radius:999px;padding:4px 9px;font-size:.7rem;font-weight:700;cursor:pointer}
.langs button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* The verdict has to be readable at arm's length, outdoors, in a hurry.
   It is the whole top of the screen and it is one word. */
.verdict{padding:34px 20px 30px;text-align:center;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.verdict.ok{background:linear-gradient(160deg,#1B8C3D,#12692c)}
.verdict.no{background:linear-gradient(160deg,#D21034,#9c0a26)}
.verdict.wait{background:linear-gradient(160deg,#5A6B8A,#3d4a63)}
/* Amber, not red: a ticket scanned twice in ten seconds is usually the same
   doorman, and a red screen there teaches people to ignore red screens. */
.verdict.warn{background:linear-gradient(160deg,#D4A017,#a37605)}
.mark{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);
  border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;
  justify-content:center;font-size:2.5rem;line-height:1}
.verdict h1{font-size:2.1rem;font-weight:900;letter-spacing:-.5px;line-height:1}
.verdict p{font-size:.95rem;font-weight:600;opacity:.92;max-width:22rem}

.card{background:var(--white);margin:16px;border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden}
.card h2{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);padding:14px 16px 0}
.rows{padding:8px 16px 14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:9px 0;border-bottom:1px solid #F0F3F7}
.row:last-child{border-bottom:none}
.row .k{font-size:.78rem;color:var(--text-light);font-weight:600;flex-shrink:0}
.row .v{font-size:.95rem;font-weight:700;text-align:right;word-break:break-word}
.row .v.ref{font-family:var(--mono);font-size:.85rem;letter-spacing:.02em}

.manual{margin:0 16px 24px}
.manual label{display:block;font-size:.78rem;font-weight:700;color:var(--text-light);margin-bottom:7px}
.manual .inp{display:flex;gap:8px}
.manual input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;
  padding:12px 13px;font-size:1rem;font-family:var(--mono);text-transform:uppercase}
.manual input:focus{outline:none;border-color:var(--blue)}
.manual button{background:var(--blue);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-weight:800;font-size:.9rem;cursor:pointer;white-space:nowrap}
.door{margin:0 16px 8px}
.door .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 14px}
.door .bar.on{border-color:var(--green);background:#F1FAF3}
.door .state{font-size:.78rem;font-weight:800;color:var(--text-light)}
.door .bar.on .state{color:var(--green)}
.door .bar button{border:1.5px solid var(--border);background:var(--white);color:var(--text);
  border-radius:9px;padding:8px 13px;font-size:.78rem;font-weight:800;cursor:pointer}
.door .bar.on button{border-color:var(--green);color:var(--green)}
.door .unlock{display:none;margin-top:9px}
.door .unlock.show{display:block}
.door .unlock label{display:block;font-size:.75rem;font-weight:700;color:var(--text-light);margin-bottom:7px}
.door .unlock .inp{display:flex;gap:8px}
.door .unlock input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;
  padding:12px 13px;font-size:1rem;font-family:var(--mono);text-transform:uppercase}
.door .unlock input:focus{outline:none;border-color:var(--green)}
.door .unlock button{background:var(--green);color:#fff;border:none;border-radius:10px;
  padding:12px 18px;font-weight:800;font-size:.9rem;cursor:pointer;white-space:nowrap}
.door .err{color:var(--red);font-size:.75rem;font-weight:700;margin-top:7px;display:none}
.door .err.show{display:block}
.foot{margin-top:auto;padding:18px 16px 26px;text-align:center;
  font-size:.72rem;color:var(--text-muted);line-height:1.6}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:560px){
  .verdict h1{font-size:2.6rem}
  .card,.manual,.door{max-width:520px;margin-left:auto;margin-right:auto}
}

var I18N = {

        notPaid:'NON PAYÉ', notFound:'BILLET INTROUVABLE', failed:'PAIEMENT ÉCHOUÉ',
        refunded:'REMBOURSÉ', error:'VÉRIFICATION IMPOSSIBLE',

        noRefSub:'Scannez le QR code du billet, ou saisissez la référence ci-dessous.',
        noRef:'SAISISSEZ UNE RÉFÉRENCE', ticketDetails:'Détails du billet',
        manualLabel:'Ou saisissez la référence manuellement', btnCheck:'Vérifier',
        footNote:'Cette page lit seulement le billet. Elle ne change rien.',
        lEvent:'Événement', lDate:'Date', lPlace:'Lieu', lName:'Nom', lType:'Type de billet',
        lQty:'Quantité', lRef:'Référence', lPaid:'Payé le', lAmount:'Total',
        doorOff:'Mode Entrée : éteint', doorOn:'Mode Entrée : activé', btnDoorOn:'Activer', btnDoorOff:'Éteindre',
        doorCodeLabel:'Saisissez le code d\'entrée de l\'événement', btnUnlock:'Ouvrir',
        badCode:'CODE INCORRECT', badCodeSub:'Ce code n\'est pas valable. Demandez le code d\'entrée à l\'organisateur.',
        okIn:'VALIDE — ENTRÉE ENREGISTRÉE', okInSub:'Le billet est marqué utilisé. Laissez la personne entrer.',
        usedNow:'VOUS VENEZ DE LE SCANNER', usedNowSub:'C\'est vous qui venez de le scanner. Même personne — laissez entrer.',
        used:'DÉJÀ UTILISÉ', usedSub:'Quelqu\'un est déjà entré avec ce billet. Ne laissez pas entrer une deuxième personne.',

        getCode:'Organisateur ? Obtenez le code d\'entrée de votre événement',
        lUsed:'Utilisé', lUsedBy:'À l\'entrée', lScans:'Nombre de scans',
        notActive:'PAS ENCORE ACTIF', notActiveSub:'Ce QR code s\'active {when} (2 heures avant l\'événement). Ne laissez pas entrer maintenant.',
        invalid:'BILLET NON VALABLE', cancelledSub:'Cet événement est annulé.', needQrSub:'Ce billet doit être scanné avec son QR code (le numéro ne suffit pas).' },
  en: { doorTitle:'Door Check', checking:'Checking...', ok:'VALID — LET THEM IN',
        notPaid:'NOT PAID', notFound:'NO SUCH TICKET', failed:'PAYMENT FAILED',
        refunded:'REFUNDED', error:'CANNOT VERIFY',
        okSub:'This ticket is paid. Let the person in.',
        notPaidSub:'We could not find the payment. Do not let them in without checking with the organiser.',
        notFoundSub:'No ticket has this reference. Check the code.',
        errorSub:'We could not reach the server. Try again in a moment.',
        noRefSub:'Scan the QR code on the ticket, or type the reference below.',
        noRef:'ENTER A REFERENCE', ticketDetails:'Ticket details',
        manualLabel:'Or type the reference by hand', btnCheck:'Check',
        footNote:'This page only reads the ticket. It changes nothing.',
        lEvent:'Event', lDate:'Date', lPlace:'Place', lName:'Name', lType:'Ticket type',
        lQty:'Quantity', lRef:'Reference', lPaid:'Paid', lAmount:'Total',
        doorOff:'Door mode: off', doorOn:'Door mode: on', btnDoorOn:'Turn on', btnDoorOff:'Turn off',
        doorCodeLabel:'Enter the event door code', btnUnlock:'Unlock',
        badCode:'WRONG CODE', badCodeSub:'That code is not valid. Ask the organiser for the door code.',
        okIn:'VALID — CHECKED IN', okInSub:'The ticket is now marked used. Let the person in.',
        usedNow:'YOU JUST SCANNED THIS', usedNowSub:'You scanned it a moment ago. Same person — let them in.',
        used:'ALREADY USED', usedSub:'Somebody already came in on this ticket. Do not let a second person in.',
        footNoteDoor:'Door mode is on: every ticket you scan is marked used.',
        getCode:'Organiser? Get your event\'s door code',
        lUsed:'Used', lUsedBy:'At the door', lScans:'Times scanned',
        notActive:'NOT YET ACTIVE', notActiveSub:'This QR code activates {when} (2 hours before the event). Do not let them in yet.',
        invalid:'INVALID TICKET', cancelledSub:'This event is cancelled.', needQrSub:'This ticket must be scanned with its QR code (the number alone is not enough).' }
};
var lang = (localStorage.getItem('tl_lang') || 'ht');
if (!I18N[lang]) lang = 'ht';
function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.ht[k] || k; }

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('.langs button').forEach(function(b) {
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  document.documentElement.lang = lang;
}
document.querySelectorAll('.langs button').forEach(function(b) {
  b.addEventListener('click', function() {
    lang = b.getAttribute('data-lang');
    localStorage.setItem('tl_lang', lang);
    applyI18n();
    if (lastData) show(lastData); else if (!currentRef) idle();
  });
});

/* The verdict lines carry data-i18n so a language switch re-translates them,
   which means the key has to be MOVED, not just the text: leaving the markup's
   original key in place made applyI18n() paint "Ap verifye..." back over every
   answer, so the door saw the same screen whatever the ticket said. */
function setVerdict(kind, headKey, subKey) {
  var v = document.getElementById('verdict');
  v.className = 'verdict ' + kind;
  document.getElementById('mark').innerHTML =
    kind === 'ok' ? '&#10003;' : (kind === 'no' ? '&#10005;' : (kind === 'warn' ? '!' : '?'));
  var h = document.getElementById('headline');
  h.setAttribute('data-i18n', headKey);
  h.textContent = t(headKey);
  var s = document.getElementById('subline');
  if (subKey) { s.setAttribute('data-i18n', subKey); s.textContent = t(subKey); }
  else { s.removeAttribute('data-i18n'); s.textContent = ''; }
}

function formatDate(d) {
  if (!d) return '';
  try {
    var dt = new Date(d + 'T00:00:00');
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString(lang === 'en' ? 'en-GB' : 'fr-FR',
      { day:'numeric', month:'long', year:'numeric' });
  } catch (e) { return d; }
}
function formatWhen(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleString(lang === 'en' ? 'en-GB' : 'fr-FR'); }
  catch (e) { return iso; }
}

var lastData = null;
var currentRef = '';

function row(k, v) {
  if (v === '' || v === null || v === undefined) return '';
  return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
}
function refRow(k, v) {
  return '<div class="row"><span class="k">' + k + '</span><span class="v ref">' + v + '</span></div>';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------------------------------------------------------------------
   Door mode.

   Looking at a ticket and spending it are two different acts, so they are two
   buttons and two routes. With door mode off this page reads and changes
   nothing, which is why anybody may open it. With door mode on - which takes
   the event's door code, typed once and kept on this phone - every scan marks
   the ticket used, and the next phone to see the same QR code is told so.

   Kept on the phone in localStorage on purpose: the doorman scans with the
   camera, which reopens this page from scratch for every single ticket. Asking
   for the code each time would mean it was never used.
   --------------------------------------------------------------------------- */
var doorCode = localStorage.getItem('tl_door_code') || '';
/* 29 Oct 2026: which phone at the door this is. "You just scanned this - same
   person" is only true on the phone that DID the first scan; on any other
   phone, a second scan within 90 seconds is exactly the screenshot at another
   gate that Jeffery asked us to stop. Sent as the door label. */
var myDoor = localStorage.getItem('tl_door_id');
if (!myDoor) {
  myDoor = 'Pòt-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  try { localStorage.setItem('tl_door_id', myDoor); } catch (e) {}
}

function doorOn() { return !!doorCode; }

function paintDoor() {
  var bar = document.getElementById('doorBar');
  var state = document.getElementById('doorState');
  var btn = document.getElementById('doorBtn');
  var foot = document.getElementById('footNote');
  bar.classList.toggle('on', doorOn());
  state.setAttribute('data-i18n', doorOn() ? 'doorOn' : 'doorOff');
  state.textContent = t(doorOn() ? 'doorOn' : 'doorOff');
  btn.setAttribute('data-i18n', doorOn() ? 'btnDoorOff' : 'btnDoorOn');
  btn.textContent = t(doorOn() ? 'btnDoorOff' : 'btnDoorOn');
  foot.setAttribute('data-i18n', doorOn() ? 'footNoteDoor' : 'footNote');
  foot.textContent = t(doorOn() ? 'footNoteDoor' : 'footNote');
}

function toggleDoor() {
  if (doorOn()) {
    doorCode = '';
    localStorage.removeItem('tl_door_code');
    document.getElementById('doorUnlock').classList.remove('show');
    document.getElementById('doorErr').classList.remove('show');
    paintDoor();
    return;
  }
  var u = document.getElementById('doorUnlock');
  u.classList.toggle('show');
  if (u.classList.contains('show')) document.getElementById('doorInput').focus();
}

function unlockDoor() {
  var v = document.getElementById('doorInput').value.trim().toUpperCase();
  if (!v) return;
  doorCode = v;
  localStorage.setItem('tl_door_code', v);
  document.getElementById('doorInput').value = '';
  document.getElementById('doorUnlock').classList.remove('show');
  document.getElementById('doorErr').classList.remove('show');
  paintDoor();
  /* The code is not checked here - there is nothing on this phone that could
     check it. It is proved by the first scan, and a wrong one turns door mode
     back off with a message rather than quietly failing to admit anybody. */
  if (currentRef) check(currentRef);
}
document.getElementById('doorInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlockDoor();
});

function show(data) {
  lastData = data;
  if (data.reason === 'bad_code') {
    doorCode = '';
    localStorage.removeItem('tl_door_code');
    paintDoor();
    document.getElementById('doorErr').classList.add('show');
    document.getElementById('doorUnlock').classList.add('show');
    setVerdict('no', 'badCode', 'badCodeSub');
    document.getElementById('details').style.display = 'none';
    applyI18n();
    return;
  }
  /* 29 Oct 2026: the server now says which of the four it is - VALID,
     ALREADY USED, NOT YET ACTIVE, INVALID - and that decides the screen. */
  if (data.state === 'not_active') {
    setVerdict('warn', 'notActive', '');
    var sl = document.getElementById('subline');
    sl.removeAttribute('data-i18n');
    sl.textContent = t('notActiveSub').replace('{when}', formatWhen(data.activatesAt));
  }
  else if (data.state === 'invalid') {
    var sub = data.reason === 'event_cancelled' ? 'cancelledSub' : data.reason === 'need_qr' ? 'needQrSub'
      : data.reason === 'not_found' ? 'notFoundSub' : 'notPaidSub';
    setVerdict('no', 'invalid', sub);
  }
  else if (data.state === 'used') {
    if (data.firstUse === false && data.secondsAgo !== null && data.secondsAgo < 90 && data.usedBy === myDoor) setVerdict('warn', 'usedNow', 'usedNowSub');
    else setVerdict('no', 'used', 'usedSub');
  }
  else if (data.state === 'valid' && data.firstUse === true) setVerdict('ok', 'okIn', 'okInSub');
  else if (data.state === 'valid') setVerdict('ok', 'ok', 'okSub');
  else if (data.valid && data.firstUse === true) setVerdict('ok', 'okIn', 'okInSub');
  else if (data.valid && data.firstUse === false) {
    // Under a minute and a half is almost always the same doorman scanning
    // twice, or the page reloading, not a second person on a copied ticket.
    if (data.secondsAgo !== null && data.secondsAgo < 90) setVerdict('warn', 'usedNow', 'usedNowSub');
    else setVerdict('no', 'used', 'usedSub');
  }
  // Read-only mode still has to say a ticket has been spent, or a doorman with
  // door mode off would wave through the second person holding the same photo.
  else if (data.valid && data.used) setVerdict('no', 'used', 'usedSub');
  else if (data.valid) setVerdict('ok', 'ok', 'okSub');
  else if (data.reason === 'not_found') setVerdict('no', 'notFound', 'notFoundSub');
  else if (data.reason === 'failed') setVerdict('no', 'failed', 'notPaidSub');
  else if (data.reason === 'refunded') setVerdict('no', 'refunded', 'notPaidSub');
  else if (data.reason === 'error') setVerdict('wait', 'error', 'errorSub');
  else setVerdict('no', 'notPaid', 'notPaidSub');

  if (data.reason === 'not_found' || data.reason === 'error' || data.reason === 'need_qr') {
    document.getElementById('details').style.display = 'none';
    applyI18n();
    return;
  }
  var ev = data.event || {};
  var html = '';
  html += row(t('lEvent'), esc(ev.title));
  html += row(t('lDate'), esc(formatDate(ev.date)));
  html += row(t('lPlace'), esc(ev.location));
  html += row(t('lName'), esc(data.buyerName));
  html += row(t('lType'), esc(data.ticketName));
  html += row(t('lQty'), esc(data.qty));
  html += row(t('lAmount'), data.totalAmount ? 'HTG ' + esc(data.totalAmount) : '');
  html += row(t('lPaid'), esc(formatWhen(data.paidAt)));
  if (data.used) {
    html += row(t('lUsed'), esc(formatWhen(data.usedAt)));
    html += row(t('lUsedBy'), esc(data.usedBy));
    if (data.useCount > 1) html += row(t('lScans'), esc(data.useCount));
  }
  html += refRow(t('lRef'), esc(data.referenceId));
  document.getElementById('rows').innerHTML = html;
  document.getElementById('details').style.display = '';
  applyI18n();
}

function idle() {
  lastData = null;
  setVerdict('wait', 'noRef', 'noRefSub');
  document.getElementById('mark').innerHTML = '&#9776;';
  document.getElementById('details').style.display = 'none';
  applyI18n();
}

var currentToken = '';
function check(ref) {
  currentRef = ref;
  setVerdict('wait', 'checking', '');
  document.getElementById('mark').innerHTML = '<div class="spin"></div>';
  document.getElementById('details').style.display = 'none';
  var url = currentToken
    ? API_URL + '/api/payments/qr/' + encodeURIComponent(currentToken)
    : API_URL + '/api/payments/check/' + encodeURIComponent(ref);
  var opts = doorOn()
    ? { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Door-Code': doorCode }, body: JSON.stringify({ door: myDoor }) }
    : { method:'GET' };
  if (doorOn()) url += '/use';
  fetch(url, opts)
    .then(function(r) { return r.json(); })
    .then(function(d) { show(d); })
    .catch(function() { show({ valid:false, reason:'error' }); });
}

function go() {
  var v = document.getElementById('refInput').value.trim().toUpperCase();
  if (!v) return;
  currentToken = '';
  history.replaceState(null, '', 'check.html?ref=' + encodeURIComponent(v));
  check(v);
}
document.getElementById('refInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') go();
});

applyI18n();
paintDoor();
(function start() {
  var q = new URLSearchParams(window.location.search);
  var tok = (q.get('t') || '').toLowerCase();
  if (/^[a-f0-9]{32}$/.test(tok)) { currentToken = tok; check('qr'); return; }
  var ref = q.get('ref');
  if (!ref) { idle(); return; }
  document.getElementById('refInput').value = ref;
  check(ref);
})();
</script>
<script src="js/pwa.js" defer></script>
<script src="js/msw-return.js?v=1" defer></script>
</body>
